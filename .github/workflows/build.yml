name: Build Rush Music Studio

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bundle the app into one offline HTML file
        run: python build.py
      - name: Copy app into the desktop shell
        shell: bash
        run: mkdir -p desktop/app && cp dist/RushMusicStudio.html desktop/app/
      - name: Fetch the AI stem separator (HTDemucs + ONNX Runtime)
        shell: bash
        run: bash desktop/fetch-ai.sh
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check AI stem quality
        if: matrix.os == 'ubuntu-latest' && hashFiles('desktop/ai/models/manifest.json') != ''
        continue-on-error: true
        shell: bash
        run: |
          npm install --no-save --no-audit --no-fund --prefix "$RUNNER_TEMP/ortn" onnxruntime-node > /dev/null 2>&1
          node desktop/ci-ai-test.js "$RUNNER_TEMP/ortn/node_modules/onnxruntime-node"
          pip install -q playwright && python -m playwright install --with-deps chromium > /dev/null 2>&1
          curl -fsSL -o desktop/ai/models/htdemucs32.onnx https://huggingface.co/adowu/htdemucs-onnx/resolve/main/htdemucs.onnx || true
          python desktop/ci-browser-test.py
      - name: Remove test files from the app folder
        if: always()
        shell: bash
        run: rm -rf desktop/app/ci desktop/ai/models/htdemucs32.onnx
      - name: Install build tools
        working-directory: desktop
        shell: bash
        run: |
          for i in 1 2 3; do
            npm install --no-audit --no-fund 2>&1 | tee install.log && break
            echo "Install attempt $i failed, retrying in 20 s"; rm -rf node_modules; sleep 20
            [ $i = 3 ] && { echo "::error title=npm install::$(tail -c 2000 install.log | tr '\n' '|')"; exit 1; }
          done
      - name: Build installers
        working-directory: desktop
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          npm run dist 2>&1 | tee build.log
      - name: Report build error
        if: failure()
        shell: bash
        working-directory: desktop
        run: |
          tail -c 2500 build.log | tr '\n' '|' | sed 's/%/%25/g' > tail.txt || true
          echo "::error title=electron-builder::$(cat tail.txt)"
          ls -la release || true
      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: rush-${{ matrix.os }}
          path: |
            desktop/release/*.exe
            desktop/release/*.dmg
            desktop/release/*.AppImage
            desktop/release/*.deb
          if-no-files-found: ignore
      - name: Upload offline HTML
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: rush-html
          path: dist/RushMusicStudio.html

  release:
    # Publishes (or updates) the release named after the version in desktop/package.json
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read version
        id: ver
        run: echo "v=v$(jq -r .version desktop/package.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.v }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          name: Rush Music Studio ${{ steps.ver.outputs.v }}
          body: |
            Download for your computer:
            - **Windows:** `RushMusicStudio-*-win-x64.exe` (installer) or `RushMusicStudio-*-portable.exe` (no install)
            - **Mac:** `.dmg` (unsigned: right-click the app → Open the first time)
            - **Linux:** `.AppImage` or `.deb`
            - **Any computer:** `RushMusicStudio.html` — open it in Chrome or Edge, fully offline (fast stem separator only; the AI separator ships with the desktop app).
          files: out/*
