name: Build Rush Music Studio

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bundle the app into one offline HTML file
        run: python build.py
      - name: Copy app into the desktop shell
        shell: bash
        run: mkdir -p desktop/app && cp dist/RushMusicStudio.html desktop/app/
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install build tools
        working-directory: desktop
        run: npm install --no-audit --no-fund
      - name: Build installers
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run dist
      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: rush-${{ matrix.os }}
          path: |
            desktop/release/*.exe
            desktop/release/*.dmg
            desktop/release/*.AppImage
            desktop/release/*.deb
          if-no-files-found: ignore
      - name: Upload offline HTML
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: rush-html
          path: dist/RushMusicStudio.html

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          name: Rush Music Studio ${{ github.ref_name }}
          body: |
            Download for your computer:
            - **Windows:** `RushMusicStudio-*-win-x64.exe` (installer) or `RushMusicStudio-*-portable.exe` (no install)
            - **Mac:** `.dmg` (unsigned: right-click the app → Open the first time)
            - **Linux:** `.AppImage` or `.deb`
            - **Any computer:** `RushMusicStudio.html` — open it in Chrome or Edge, fully offline.
          files: out/*
